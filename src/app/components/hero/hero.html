<section id="hero" class="hero">
  <div class="hero__grid"></div>
  <div class="container hero__inner">
    <p class="hero__hi" appReveal>
      <span class="hero__prompt">$</span> Hi, my name is
    </p>

    <h1 class="hero__name" appReveal [revealDelay]="100">{{ data.name }}</h1>

    <h2 class="hero__role" appReveal [revealDelay]="200">
      <span class="hero__role-text" [attr.data-role]="currentRole()">{{ currentRole() }}</span>
    </h2>

    <p class="hero__tagline" appReveal [revealDelay]="300">{{ data.tagline }}</p>

    <div class="hero__cta" appReveal [revealDelay]="400">
      <a href="#projects" class="btn btn--primary">View Projects</a>
      <a [href]="data.resumeFile" download class="btn btn--ghost">Download Resume</a>
    </div>

    <div class="hero__socials" appReveal [revealDelay]="500">
      @for (s of data.socials; track s.label) {
        <a [href]="s.href" [attr.aria-label]="s.label" target="_blank" rel="noopener">
          @switch (s.icon) {
            @case ('github') {
              <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.2 11.39.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.33-1.76-1.33-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.83 1.24 1.83 1.24 1.07 1.83 2.81 1.3 3.5.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.95 0-1.31.47-2.39 1.24-3.23-.13-.3-.54-1.52.11-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.77.84 1.23 1.92 1.23 3.23 0 4.62-2.81 5.64-5.49 5.94.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58C20.56 22.29 24 17.8 24 12.5 24 5.87 18.63.5 12 .5z"/></svg>
            }
            @case ('linkedin') {
              <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zm1.78 13.02H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/></svg>
            }
            @case ('email') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
            }
          }
        </a>
      }
    </div>
  </div>

  <a href="#about" class="hero__scroll" aria-label="Scroll down">
    <span></span>
  </a>
</section>
