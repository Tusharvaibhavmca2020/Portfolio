<section id="about" class="section section--alt">
  <div class="container">
    <div class="section-head" appReveal>
      <span class="section-eyebrow">01. // about</span>
      <h2 class="section-title">About Me</h2>
    </div>

    <div class="about__body">
      <p class="about__summary" appReveal [revealDelay]="100">{{ data.summary }}</p>

      <div class="about__stats">
        @for (stat of data.stats; track stat.label; let i = $index) {
          <div class="stat-card" appReveal [revealDelay]="150 + i * 90">
            <span class="stat-card__value">{{ stat.value }}</span>
            <span class="stat-card__label">{{ stat.label }}</span>
          </div>
        }
      </div>

      <p class="about__location" appReveal [revealDelay]="200">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        {{ data.location }}
      </p>
    </div>
  </div>
</section>
